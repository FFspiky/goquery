name: Cross-platform PR checks
on:
  push:
    branches: [ci/validate-pr-633]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: [1.26.x, 1.27.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 36faee23f1ceec9745964c822d70dafd25acf938
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
